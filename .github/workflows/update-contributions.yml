name: Update Contribution Graphs

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "assets/heatmap-*.svg"
      - "assets/trend-*.svg"
      - "assets/metrics-*.svg"
  repository_dispatch:
    types: [refresh-profile]
  workflow_dispatch:

concurrency:
  group: update-profile-metrics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate unified dark and light profile SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Java-Mx
        run: python scripts/generate_contrib_svgs.py

      - name: Commit updated SVGs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/heatmap-dark.svg assets/heatmap-light.svg assets/trend-dark.svg assets/trend-light.svg assets/metrics-dark.svg assets/metrics-light.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh live contribution and metrics SVGs"
            git push
          fi
