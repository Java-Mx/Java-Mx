name: Update Contribution Graphs

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate unified dark and light profile SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Java-Mx
        run: python scripts/generate_contrib_svgs.py

      - name: Commit updated SVGs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/heatmap-dark.svg assets/heatmap-light.svg assets/trend-dark.svg assets/trend-light.svg assets/metrics-dark.svg assets/metrics-light.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update live profile metrics and contribution SVGs"
            git push
          fi
