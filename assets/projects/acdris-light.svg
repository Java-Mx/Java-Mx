<svg xmlns="http://www.w3.org/2000/svg" width="442" height="184" viewBox="0 0 442 184" role="img" aria-label="ACDRIS — Airspace Conflict Detection &amp; Risk Intelligence">
  <rect x="0.5" y="0.5" width="441" height="183" rx="12" fill="#f6f8fa"/>
  <rect x="0.5" y="0.5" width="441" height="183" rx="12" fill="none" stroke="#d0d7de" stroke-opacity="1" stroke-width="1"/>

  <!-- Icon tile -->
  <rect x="20" y="19" width="28" height="28" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

    <g stroke="#0969da" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="34" cy="33" r="7.5"/>
      <circle cx="34" cy="33" r="3.5"/>
      <line x1="34" y1="33" x2="39.3" y2="27.7"/>
      <circle cx="34" cy="33" r="1" fill="#0969da"/>
    </g>

  <!-- Title & subtitle -->
  <text x="58" y="31" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">ACDRIS</text>
  <text x="58" y="47" fill="#656d76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Airspace Conflict Detection &amp; Risk Intelligence</text>

  <!-- Status pill -->
  <rect x="354" y="20" width="68" height="22" rx="11" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="388.0" y="34.5" text-anchor="middle" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="500">Private</text>

  <!-- Description -->
  <text x="20" y="78" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Real-time Indian FIR ADS-B surveillance with Haversine</text>
  <text x="20" y="96" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">proximity and deterministic conflict scoring (BI, not ATC).</text>

  <!-- Tech chips -->
  <rect x="20" y="114" width="53" height="21" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="46.5" y="128" text-anchor="middle" fill="#24292f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">Python</text>
  <rect x="79" y="114" width="78" height="21" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="118.0" y="128" text-anchor="middle" fill="#24292f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">PostgreSQL</text>
  <rect x="163" y="114" width="84" height="21" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="205.0" y="128" text-anchor="middle" fill="#24292f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">APScheduler</text>
  <rect x="253" y="114" width="71" height="21" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="288.5" y="128" text-anchor="middle" fill="#24292f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">Streamlit</text>
  <rect x="330" y="114" width="53" height="21" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="356.5" y="128" text-anchor="middle" fill="#24292f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">pydeck</text>

  <!-- Footer -->
  <line x1="20" y1="149" x2="422" y2="149" stroke="#d8dee4" stroke-width="1"/>
  <text x="20" y="168" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">Decision-Support BI</text>
  <text x="422" y="168" text-anchor="end" fill="#656d76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400">Private repository</text>
</svg>
