<svg xmlns="http://www.w3.org/2000/svg" width="442" height="184" viewBox="0 0 442 184" role="img" aria-label="VMDB-OSS — Vulnerability Management DB for Open-Source Software">
  <rect x="0.5" y="0.5" width="441" height="183" rx="12" fill="#f6f8fa"/>
  <rect x="0.5" y="0.5" width="441" height="183" rx="12" fill="none" stroke="#d0d7de" stroke-opacity="1" stroke-width="1"/>

  <!-- Icon tile -->
  <rect x="20" y="19" width="28" height="28" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

    <g stroke="#0969da" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="34" cy="28.5" rx="6.5" ry="2.6"/>
      <path d="M27.5 28.5 V37.5 C27.5 39 30.4 40.1 34 40.1 C37.6 40.1 40.5 39 40.5 37.5 V28.5"/>
      <path d="M27.5 33 C27.5 34.5 30.4 35.6 34 35.6 C37.6 35.6 40.5 34.5 40.5 33"/>
    </g>

  <!-- Title & subtitle -->
  <text x="58" y="31" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">VMDB-OSS</text>
  <text x="58" y="47" fill="#656d76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Vulnerability Management DB for Open-Source Software</text>

  <!-- Status pill -->
  <rect x="361" y="20" width="61" height="22" rx="11" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="391.5" y="34.5" text-anchor="middle" fill="#0969da" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="500">Public</text>

  <!-- Description -->
  <text x="20" y="78" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Normalized 3NF MySQL schema with foreign keys, SQL views,</text>
  <text x="20" y="96" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">and stored procedures for CVE remediation &amp; audit trails.</text>

  <!-- Tech chips -->
  <rect x="20" y="114" width="47" height="21" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="43.5" y="128" text-anchor="middle" fill="#24292f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">MySQL</text>
  <rect x="73" y="114" width="78" height="21" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="112.0" y="128" text-anchor="middle" fill="#24292f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">3NF Schema</text>
  <rect x="157" y="114" width="71" height="21" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="192.5" y="128" text-anchor="middle" fill="#24292f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">SQL Views</text>
  <rect x="234" y="114" width="78" height="21" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="273.0" y="128" text-anchor="middle" fill="#24292f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">Procedures</text>

  <!-- Footer -->
  <line x1="20" y1="149" x2="422" y2="149" stroke="#d8dee4" stroke-width="1"/>
  <text x="20" y="168" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">MIT · Relational SQL</text>
  <text x="422" y="168" text-anchor="end" fill="#0969da" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600">View Repository &#8594;</text>
</svg>
