  <rect x="0.5" y="0.5" width="441" height="183" rx="12" fill="none" stroke="#d0d7de" stroke-opacity="1" stroke-width="1"/>

  <!-- Icon tile -->
  <rect x="20" y="19" width="28" height="28" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

    <g stroke="#0969da" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="34" cy="33" r="7.5"/>
      <ellipse cx="34" cy="33" rx="3.4" ry="7.5"/>
      <line x1="26.5" y1="33" x2="41.5" y2="33"/>
    </g>

  <!-- Title & subtitle -->
  <text x="58" y="31" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">AERIS</text>
  <text x="58" y="47" fill="#656d76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Autonomous Exposure &amp; Risk Intelligence System</text>

