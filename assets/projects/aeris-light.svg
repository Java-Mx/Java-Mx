  <!-- Description -->
  <text x="20" y="78" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Explainable internet exposure analysis combining anomaly</text>
