  <text x="173.5" y="128" text-anchor="middle" fill="#24292f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">PyTorch</text>
  <rect x="209" y="114" width="65" height="21" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="241.5" y="128" text-anchor="middle" fill="#24292f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">NetworkX</text>
