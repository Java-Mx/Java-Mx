<svg xmlns="http://www.w3.org/2000/svg" width="900" height="176" viewBox="0 0 900 176" role="img" aria-label="Ashwin Chhawaniya — AI, Cybersecurity, FinTech, Data Engineering">
  <defs>
    <radialGradient id="glow-light" cx="85%" cy="45%" r="32%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f6f8fa" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card-clip-light">
      <rect x="0.5" y="0.5" width="899" height="175" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip-light)">
    <rect width="900" height="176" fill="#f6f8fa"/>
    <rect width="900" height="176" fill="url(#glow-light)"/>

    <!-- Minimal deterministic graph motif (gridless) -->
    <g stroke="#0969da" stroke-opacity="0.22" stroke-width="1.25" fill="none">
      <line x1="714" y1="46" x2="778" y2="80"/>
      <line x1="778" y1="80" x2="846" y2="52"/>
      <line x1="778" y1="80" x2="828" y2="126"/>
      <line x1="714" y1="46" x2="738" y2="124"/>
      <line x1="738" y1="124" x2="828" y2="126"/>
      <line x1="738" y1="124" x2="778" y2="80"/>
    </g>
    <g fill="#f6f8fa" stroke="#0969da" stroke-opacity="0.55" stroke-width="1.5">
      <circle cx="714" cy="46" r="3.8"/>
      <circle cx="846" cy="52" r="3.5"/>
      <circle cx="738" cy="124" r="3.5"/>
      <circle cx="828" cy="126" r="3.8"/>
    </g>
    <circle cx="778" cy="80" r="4.8" fill="#0969da" fill-opacity="0.88"/>
    <circle cx="778" cy="80" r="10" fill="none" stroke="#0969da" stroke-opacity="0.22" stroke-width="1"/>
  </g>

  <!-- Uniform subtle border (no side blue bar) -->
  <rect x="0.5" y="0.5" width="899" height="175" rx="12" fill="none" stroke="#d0d7de" stroke-width="1"/>

  <!-- Typography -->
  <text x="36" y="42" fill="#0969da" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.4">JAVA-MX  //  AI · CYBERSECURITY · FINTECH · DATA ENGINEERING</text>

  <text x="36" y="86" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.4">Ashwin Chhawaniya</text>

  <text x="36" y="118" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400">Building explainable risk intelligence systems at the intersection of AI, cybersecurity, and data engineering.</text>

  <text x="36" y="148" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400">Symbiosis Artificial Intelligence Institute, Pune  ·  BBA (Hons.) in Artificial Intelligence</text>
</svg>
