<svg xmlns="http://www.w3.org/2000/svg" width="900" height="184" viewBox="0 0 900 184" role="img" aria-label="Ashwin Chhawaniya — AI, Cybersecurity, FinTech, Data Engineering">
  <defs>
    <pattern id="grid-light" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#0969da" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f6f8fa" stop-opacity="1"/>
      <stop offset="58%" stop-color="#f6f8fa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f6f8fa" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="card-clip-light">
      <rect x="0.5" y="0.5" width="899" height="183" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip-light)">
    <rect width="900" height="184" fill="#f6f8fa"/>
    <rect x="520" y="0" width="380" height="184" fill="url(#grid-light)"/>
    <rect x="520" y="0" width="380" height="184" fill="url(#fade-light)"/>

    <!-- Subtle deterministic graph motif on right -->
    <g stroke="#0969da" stroke-opacity="0.22" stroke-width="1.25" fill="none">
      <line x1="710" y1="48" x2="774" y2="82"/>
      <line x1="774" y1="82" x2="844" y2="54"/>
      <line x1="774" y1="82" x2="826" y2="128"/>
      <line x1="710" y1="48" x2="736" y2="128"/>
      <line x1="736" y1="128" x2="826" y2="128"/>
      <line x1="736" y1="128" x2="774" y2="82"/>
    </g>
    <g fill="#f6f8fa" stroke="#0969da" stroke-opacity="0.55" stroke-width="1.5">
      <circle cx="710" cy="48" r="4"/>
      <circle cx="844" cy="54" r="3.5"/>
      <circle cx="736" cy="128" r="3.5"/>
      <circle cx="826" cy="128" r="4"/>
    </g>
    <circle cx="774" cy="82" r="5" fill="#0969da" fill-opacity="0.88"/>
    <circle cx="774" cy="82" r="10" fill="none" stroke="#0969da" stroke-opacity="0.24" stroke-width="1"/>

    <!-- Left accent rule -->
    <rect x="0" y="0" width="4" height="184" fill="#0969da"/>
  </g>

  <!-- Outer hairline border -->
  <rect x="0.5" y="0.5" width="899" height="183" rx="12" fill="none" stroke="#d0d7de" stroke-width="1"/>

  <!-- Typography -->
  <text x="36" y="42" fill="#0969da" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.4">JAVA-MX  //  AI · CYBERSECURITY · FINTECH · DATA ENGINEERING</text>

  <text x="36" y="88" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.4">Ashwin Chhawaniya</text>

  <text x="36" y="120" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">Building deterministic, explainable risk-intelligence systems that turn raw telemetry into auditable decisions.</text>

  <text x="36" y="154" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="400">Symbiosis Artificial Intelligence Institute, Pune  ·  BBA (Hons.) in Artificial Intelligence</text>
</svg>
