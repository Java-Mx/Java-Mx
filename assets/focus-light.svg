<svg xmlns="http://www.w3.org/2000/svg" width="900" height="122" viewBox="0 0 900 122" role="img" aria-label="Current Focus: Native Rust Systems, Deterministic Cyber Risk, Explainable Data Engineering">
  <!-- Card 1: Native Rust Systems -->
  <rect x="0.5" y="0.5" width="288" height="121" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <rect x="18" y="18" width="28" height="28" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <g stroke="#0969da" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="27" y="27" width="10" height="10" rx="1.5"/>
    <line x1="30" y1="24" x2="30" y2="27"/>
    <line x1="34" y1="24" x2="34" y2="27"/>
    <line x1="30" y1="37" x2="30" y2="40"/>
    <line x1="34" y1="37" x2="34" y2="40"/>
    <line x1="24" y1="30" x2="27" y2="30"/>
    <line x1="24" y1="34" x2="27" y2="34"/>
    <line x1="37" y1="30" x2="40" y2="30"/>
    <line x1="37" y1="34" x2="40" y2="34"/>
  </g>
  <text x="58" y="37" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Native Rust Systems</text>
  <text x="18" y="72" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Memory-safe protocol cores, Noise XX</text>
  <text x="18" y="92" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">crypto, and cross-platform P2P meshes.</text>

  <!-- Card 2: Deterministic Cyber Risk -->
  <rect x="306" y="0.5" width="288" height="121" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <rect x="324" y="18" width="28" height="28" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <path d="M338 24.5 L345 27.2 V32.2 C345 36.2 342 39 338 40.2 C334 39 331 36.2 331 32.2 V27.2 Z" stroke="#0969da" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
  <path d="M335.2 32.2 L337.2 34.2 L341.2 30" stroke="#0969da" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="364" y="37" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Deterministic Cyber Risk</text>
  <text x="324" y="72" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Auditable CVE &amp; exposure scoring</text>
  <text x="324" y="92" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">built on explicit rules and schemas.</text>

  <!-- Card 3: Explainable Data Engineering -->
  <rect x="611.5" y="0.5" width="288" height="121" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <rect x="629.5" y="18" width="28" height="28" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <g stroke="#0969da" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="643.5" cy="27.5" rx="6.5" ry="2.6"/>
    <path d="M637 27.5 V36.5 C637 38 639.9 39.1 643.5 39.1 C647.1 39.1 650 38 650 36.5 V27.5"/>
    <path d="M637 32 C637 33.5 639.9 34.6 643.5 34.6 C647.1 34.6 650 33.5 650 32"/>
  </g>
  <text x="669.5" y="37" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Explainable Data Eng.</text>
  <text x="629.5" y="72" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Normalized 3NF data models, live</text>
  <text x="629.5" y="92" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">pipelines, and security analytics.</text>
</svg>
