  <rect x="149" y="106" width="121" height="50" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="161" y="130" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700">3</text>
